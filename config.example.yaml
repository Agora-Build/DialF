# Example dialfd config — copy to ~/.config/dialf/config.yaml and edit.
# Every field has a default; set only what you need. See docs/HARDWARE.md for the
# sound-card bridge wiring and the macOS microphone/LaunchAgent setup.
#
# Load a specific config with:  dialf daemon --config /path/to/config.yaml
# Paths inside this file (autoanswer job paths, record_dir) may be ABSOLUTE, or RELATIVE — in
# which case they resolve against THIS config file's own directory (not the daemon's working
# directory). Likewise, relative paths inside a job file (e.g. audio.play) resolve against that
# job file's directory. So a config + its jobs + recordings can live in one folder and move
# together. mac and Linux alike.

# shared_key: change-me            # must match the phone app's shared key
# ws_bind: "0.0.0.0:8765"          # phone WebSocket server bind
# instance_name: dialfd            # mDNS instance name
# control_socket: /tmp/dialfd.sock  # optional. Unset = a per-user default by install scope
#                                    # (/run/user/$UID on Linux, /tmp/dialfd-$UID on macOS). Pin it
#                                    # to a fixed path if contexts disagree (ssh vs GUI). A SYSTEM
#                                    # install (`sudo dialf service install`) is a shared daemon and
#                                    # sets these so any `dialf`-group member can use it:
# control_socket_group: dialf        #   group that owns the socket (auto-created by the installer)
# control_socket_mode: "0660"        #   octal perms — group can connect, others can't

# Inbound routing: each number is auto-answered when it rings. A null/empty value just
# answers; a job path answers AND runs that job (which should start with `call.answer`).
# Relative job paths resolve against THIS config file's directory. For a temporary,
# no-config override use `dialf run <job>.yaml --autoanswer <numbers>` instead.
# autoanswer:
#   "+15551234": jobs/inbound-call.yaml   # answer, then run this job
#   "+15559876":                          # answer only (no job)

audio:
  sample_rate: 48000                # card native rate — ALSO the recording rate (rx/tx are
                                    # written exactly as captured; 16k for VAD is derived
                                    # internally). Lower it to shrink recordings.
  channels: 1                       # capture channels; 2 records a true stereo rx.wav
                                    # (a stereo bridge/breakout — one source per input)
  # CoreAudio name (macOS) or ALSA, e.g. "plughw:1,0". Selects the device for auto-detected
  # commands; with capture_cmd/playback_cmd pinned (below) the argv's device is what runs,
  # but KEEP these set and in sync anyway — `dialf import` verifies them against the target
  # machine (and carries a device rename into the pinned commands), and the daemon uses
  # them to clean up stray audio processes holding the card.
  capture_device: "MiniFuse 2"
  playback_device: "MiniFuse 2"
  record_dir: /Users/you/dialf/recordings   # enable rx/tx/mix recording; absolute, or relative
                                            # to this config file's directory (e.g. `recordings`)
  mix_recording: true
  mix_channels: tx_rx               # mix.wav stereo layout: tx_rx = left tx (local) / right rx
                                    # (remote) [default]; rx_tx swaps them

  # Optional: pin the audio tool by full path + explicit device so a stripped PATH
  # can't fall back to a default-output tool (afplay). `gain N` adds N dB to the
  # captured far-end audio in software (drop it if the card's input gain is enough).
  #
  # `remix 1` selects capture CHANNEL 1 only. Some interfaces (e.g. the Arturia MiniFuse)
  # expose a multi-channel capture where ch 1/2 are the analog inputs and ch 3/4 are a
  # LOOPBACK of the computer's own playback. Without `remix N`, sox downmixes all of them,
  # so your injected prompt (tx) bleeds into rx. Pin the analog channel your bridge feeds.
  # Find the clean channel (bridge unplugged, while a tone plays out the card):
  #   ( sox -n -t coreaudio "MiniFuse 2" synth 8 sine 440 & ) ; sleep 1
  #   sox -t coreaudio "MiniFuse 2" /tmp/c.wav trim 0 4
  #   for ch in 1 2 3 4; do printf "ch$ch: "; sox /tmp/c.wav -n remix $ch stat 2>&1 | grep RMS; done
  # The silent channels are the analog inputs; the loud ones are the loopback. Pin a silent
  # one — `remix 1` below is just an example; use whichever channel your bridge feeds.
  capture_cmd:  ["/opt/homebrew/bin/sox", "-q", "-t", "coreaudio", "MiniFuse 2", "-t", "raw", "-b", "16", "-e", "signed-integer", "-r", "{rate}", "-c", "{channels}", "-", "remix", "1", "gain", "20"]
  playback_cmd: ["/opt/homebrew/bin/sox", "-q", "-V1", "{file}", "-t", "coreaudio", "MiniFuse 2"]

  # --- Alternative: BlackHole eval — test an agent over virtual audio (no phone, no card) ---
  # Test a local AI agent entirely in software: DialF plays prompts into BlackHole 2ch (the
  # agent's input) and captures the agent's replies from BlackHole 16ch (its output), recording
  # tx/rx/mix just like the real card. Point the agent at input=BlackHole 2ch, output=BlackHole
  # 16ch, then `dialf run jobs/blackhole.yaml` (audio-only -> no phone needed). Swap the four
  # lines above for these:
  #   playback_device: "BlackHole 2ch"
  #   capture_device:  "BlackHole 16ch"
  #   playback_cmd: ["/opt/homebrew/bin/sox", "-q", "-V1", "{file}", "-t", "coreaudio", "BlackHole 2ch"]
  #   capture_cmd:  ["/opt/homebrew/bin/sox", "-q", "-t", "coreaudio", "BlackHole 16ch", "-t", "raw", "-b", "16", "-e", "signed-integer", "-r", "{rate}", "-c", "{channels}", "-", "remix", "1"]

# --- Device sharing: let another machine drive this host's phone over adb ---------------
# `dialf devices share --target <serial>` exposes the host's adb server so a remote machine
# can run `adb shell`, `install`, `logcat`, `push`/`pull` against a phone plugged in here.
# `dialf devices share --list` shows what is attached; sharing never defaults to everything.
#
# The default bind is 0.0.0.0:5939 — reachable from the network. Without `--token` the share
# is OPEN: anyone who can reach the port can drive the phone. That is fine on a trusted or
# overlay network (Netbird/Tailscale/VPN) and not on one you do not control.
#
# `--token` issues a one-time secret, printed once when the share starts and never written
# anywhere; clients then need `dialf devices connect`. It authenticates them but does not
# encrypt the session, so tunnel it (VPN or `ssh -L`) outside a trusted network either way.
#
# Shares expire on their own — 1h by default, `expire_after: 0` never — so a door left open
# at the end of a session closes itself.
#
# adb_share:
#   enabled: false            # start with the daemon? runtime start/--stop works either way
#   bind: 0.0.0.0:5939
#   targets: ["4B2B1C"]       # or `all: true`
#   expire_after: 3600        # seconds; <= 0 never expires
#   forward_ports: [27183]    # extra ports proxied to 127.0.0.1 here, for tools that tunnel
#                             # through `adb forward` (scrcpy, flutter run, Android Studio)
